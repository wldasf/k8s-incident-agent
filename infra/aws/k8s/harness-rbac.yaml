apiVersion: v1
kind: Namespace
metadata:
  name: harness
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness
  namespace: harness
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-chaos
  namespace: chaos-mesh
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["networkchaos"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harness-chaos
  namespace: chaos-mesh
subjects:
  - kind: ServiceAccount
    name: harness
    namespace: harness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harness-chaos---
# What the harness and agent may do to the application under test.
# Derived from the kubectl commands in harness/executor.py, harness/injector.py
# and agent/cluster_view.py.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-boutique
  namespace: boutique
rules:
  # Investigate: describe pods, read logs and events. Remediate: delete pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "delete"]
  # Remediate: scale, patch, rollout restart / undo, delete deployments.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harness-boutique
  namespace: boutique
subjects:
  - kind: ServiceAccount
    name: harness
    namespace: harness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harness-boutique
---
# Cluster-wide permissions: nodes are not namespaced, and 'kubectl drain'
# evicts pods from every namespace on the node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harness-nodes
rules:
  # Cordon / uncordon (a patch to the node), and read node state.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # Drain: find every pod on the node, then evict it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harness-nodes
subjects:
  - kind: ServiceAccount
    name: harness
    namespace: harness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harness-nodes
