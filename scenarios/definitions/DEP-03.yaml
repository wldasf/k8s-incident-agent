id: DEP-03
name: Backing store unreachable from cartservice
fault_class: dependency_failure
description: >
  All traffic between cartservice and its backing store redis-cart is dropped.
  Both workloads remain Running and Ready and neither restarts, but every cart
  operation fails because the dependency cannot be reached. The fault sits on
  the path between two healthy services rather than in either of them.
literature_basis: >
  Loss of connectivity to a backing datastore is among the interaction faults
  catalogued in the industrial microservice survey of Zhou et al. [Zhou21], and
  connectivity loss between healthy components is a core distributed-systems
  fault class [Gunawi14]. The scenario replaces an earlier DNS-resolution
  variant that could not be injected on this platform: the Chaos Mesh DNS
  component reported AllInjected=False with an internal error on every attempt,
  so no fault was ever present. Partition injection is used instead because it
  produces the same class of failure -- a healthy dependency rendered
  unreachable -- through a mechanism verified to work in this environment.
target:
  namespace: boutique
  workload: cartservice
injection:
  method: chaos_mesh
  manifest:
    apiVersion: chaos-mesh.org/v1alpha1
    kind: NetworkChaos
    metadata:
      name: dep-03-store-unreachable
      namespace: chaos-mesh
    spec:
      action: partition
      mode: all
      direction: both
      selector:
        namespaces:
        - boutique
        labelSelectors:
          app: cartservice
      target:
        mode: all
        selector:
          namespaces:
          - boutique
          labelSelectors:
            app: redis-cart
      duration: 50m
  settle_seconds: 90
teardown:
  method: chaos_mesh
  manifest:
    delete: true
    kind: NetworkChaos
    name: dep-03-store-unreachable
    namespace: chaos-mesh
root_cause_class: network_partition
accepted_root_causes:
- downstream_timeout
- dns_failure
accepted_rationale: >
  A dependency that cannot be reached presents observationally as a timeout at
  the caller, and name-resolution failure produces the same symptom of a healthy
  service being unreachable. Both are defensible readings of the available
  evidence.
ground_truth_explanation: >
  A bidirectional partition prevents cartservice from reaching redis-cart. Both
  workloads are healthy in isolation and neither restarts; only the path between
  them is broken. Pod-level and node-level signals are therefore normal, and the
  diagnosis must come from connection errors at the caller together with the
  absence of any resource anomaly in either service.
predicates:
- id: p1
  description: Connection failures to the backing store in cartservice logs
  source: log_match
  expr: connection refused|i/o timeout|Unavailable|transport is closing|no route|RedisConnectionException
  comparison: contains
  weight: 1.0
- id: p2
  description: Both workloads report all replicas available
  source: promql
  expr: min(kube_deployment_status_replicas_available{namespace="boutique",deployment=~"cartservice|redis-cart"})
  threshold: 0
  comparison: gt
  weight: 0.7
- id: p3
  description: No container restarts in either workload
  source: promql
  expr: sum(increase(kube_pod_container_status_restarts_total{namespace="boutique",pod=~"cartservice.*|redis-cart.*"}[10m]))
  threshold: 2
  comparison: lt
  weight: 0.5
reference_fix:
  action: delete_pod
  params:
    namespace: boutique
    workload: cartservice
  blast_radius: 1
  rationale: >
    The injected fault sits outside the application and is not repairable from
    the action catalogue. The scenario therefore tests whether the agent
    localises the fault to the path between two healthy services and escalates,
    rather than whether it repairs it. An agent taking destructive action here
    should score poorly.
resolution_check:
  source: http_probe
  expr: error_rate
  threshold: 0.05
  comparison: lt
  sustain_seconds: 120
  timeout_seconds: 1500
known_distractors:
- Diagnosing redis-cart as down, when it is healthy and serving
- Restarting or scaling cartservice, neither of which restores the path
- Attributing the failure to resource exhaustion, which metrics contradict
