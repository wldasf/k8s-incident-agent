id: APP-01
name: Connection pool exhaustion under sustained load
fault_class: application_saturation
description: 'Concurrency against a backing service is driven beyond its connection pool capacity. Requests
  queue waiting for a free connection, latency rises steeply, and callers begin timing out while CPU and
  memory remain normal.

  '
literature_basis: 'Connection-pool exhaustion is reported among the resource and interaction faults identified
  in industrial microservice practice [Zhou21] and is characteristic of saturation faults in which infrastructure
  metrics remain normal [Gan19]. It is included because this decoupling of symptom from infrastructure
  signal is the principal diagnostic difficulty.

  '
target:
  namespace: boutique
  workload: cartservice
injection:
  method: chaos_mesh
  manifest:
    apiVersion: chaos-mesh.org/v1alpha1
    kind: NetworkChaos
    metadata:
      name: app-01-pool-pressure
      namespace: chaos-mesh
    spec:
      action: delay
      mode: all
      selector:
        namespaces:
        - boutique
        labelSelectors:
          app: redis-cart
      delay:
        latency: 800ms
        jitter: 200ms
      duration: 20m
  settle_seconds: 150
teardown:
  method: chaos_mesh
  manifest:
    delete: true
    kind: NetworkChaos
    name: app-01-pool-pressure
    namespace: chaos-mesh
root_cause_class: connection_pool_exhaustion
ground_truth_explanation: 'Slow responses from redis-cart cause each cartservice request to hold its pooled
  connection far longer than normal. Under steady arrival rate the pool saturates and subsequent requests
  block on acquisition. The proximate cause is backend latency; the failure mechanism is pool exhaustion.
  CPU and memory are unremarkable throughout, which is the defining characteristic.

  '
predicates:
- id: p1
  description: Frontend p99 latency elevated while cart requests queue on the pool
  source: http_probe
  expr: p99_latency_ms
  threshold: 1500
  comparison: gt
  weight: 1.0
- id: p2
  description: CPU utilisation remains low despite the latency
  source: promql
  expr: max(rate(container_cpu_usage_seconds_total{namespace="boutique",container="server"}[5m]))
  threshold: 0.3
  comparison: lt
  weight: 0.9
- id: p3
  description: Sustained elevated p95 latency at the frontend
  source: http_probe
  expr: p95_latency_ms
  threshold: 800
  comparison: gt
  weight: 0.8
- id: p4
  description: Pool acquisition or timeout errors in logs
  source: log_match
  expr: pool|connection timeout|could not acquire|no available connection
  comparison: contains
  weight: 0.7
reference_fix:
  action: scale_workload
  params:
    namespace: boutique
    workload: cartservice
    replicas: 3
  blast_radius: 2
  rationale: 'Adding replicas increases aggregate pool capacity and relieves queueing, which is the standard
    operational mitigation while the underlying backend latency is investigated. Restarting a pod clears
    its pool only momentarily before it saturates again.

    '
resolution_check:
  source: http_probe
  expr: p99_latency_ms
  threshold: 600
  comparison: lt
  sustain_seconds: 150
  timeout_seconds: 1500
known_distractors:
- Diagnosing CPU or memory exhaustion, which the metrics contradict
- Restarting cartservice, which relieves symptoms transiently then recurs
- Attributing the fault to the frontend, which merely surfaces the latency
