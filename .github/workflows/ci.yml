name: CI
on:
  push: 
    branches: [AWS]
  pull_request: 
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: v1.17.2
      - name: fmt
        run: terraform -chdir=infra/aws/bootstrap init -backend=false | terraform -chdir=infra/aws/bootstrap validate
        run: terraform -chdir=infra/aws/cluster init -backend=false | terraform -chdir=infra/aws/cluster validate
